services:
  - type: web
    name: ai-dj-studio-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://ai-dj-studio-nine.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: USE_IN_MEMORY_DB
        value: false
      - key: MONGODB_URI
        sync: false
      - key: AI_PROVIDER
        value: heuristic
